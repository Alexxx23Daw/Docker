apiVersion: batch/v1
kind: CronJob
metadata:
  name: ejemplo-cronjob
spec:
  schedule: "*/1 * * * *"  # (Minuto, Hora, Día-Mes, Mes, Día-Semana)
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: contenedor-cronjob
            image: busybox
            command: ["echo", "Hola desde el CronJob"]
          restartPolicy: Never
